[project]
name = "image-style-transfer"
version = "0.1.0"
description = "UPenn campus image style transfer pipeline for time-of-day and weather conditions."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "diffusers==0.27.2",
    "transformers>=4.38.0,<5",
    "huggingface-hub<0.26",
    "accelerate>=0.27.0",
    "peft>=0.9.0",
    "controlnet-aux>=0.0.7",
    "opencv-python-headless>=4.9.0",
    "pillow>=10.0.0",
    "pillow-heif>=0.15.0",
    "scikit-image>=0.22.0",
    "pandas>=2.0.0",
    "lpips>=0.1.4",
    "tqdm>=4.66.0",
    "wandb>=0.16.0",
    "streamlit>=1.32.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.10.9",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
